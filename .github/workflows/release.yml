name: Release

# Publicación manual y autorizada. NO despliega: el despliegue en Canumpe es manual (docs/DEPLOYMENT.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión semver sin prefijo (p. ej. 1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Controles obligatorios (CI)
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publicar imagen en GHCR
    needs: verify
    runs-on: ubuntu-24.04
    environment: production # configurar "required reviewers" para exigir aprobación manual
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/ulisesvar/orlando-pwa
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validar versión
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Versión inválida: $VERSION"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Construir localmente para escanear antes de publicar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: orlando-pwa:candidate
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ github.sha }}
      - name: Escaneo previo a la publicación (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: orlando-pwa:candidate
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:v${{ inputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ github.sha }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Registrar digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Imagen publicada"
            echo
            echo "- Referencia para producción (fijada por digest): \`${IMAGE}@${DIGEST}\`"
            echo "- Etiquetas: \`v${VERSION}\`, \`sha-${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
