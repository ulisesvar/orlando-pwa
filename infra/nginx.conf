# Nginx sin privilegios, compatible con sistema de archivos de solo lectura:
# pid y temporales en /tmp (tmpfs); logs a stdout/stderr.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types { application/manifest+json webmanifest; }

  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 1k;
  charset utf-8;
  gzip on;
  gzip_types text/css text/javascript application/json application/manifest+json image/svg+xml;

  # Política de caché por tipo de archivo. Todo se revalida (ETag) excepto los iconos.
  map $uri $cache_control {
    default "no-cache";
    ~*\.(png|svg)$ "public, max-age=86400";
  }

  server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HSTS lo gestiona Cloudflare en el borde; no se emite aquí para no afectar
    # a otros subdominios ni contradecir la política del proxy.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; font-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $cache_control always;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location ~ /\. { return 404; }
    location = / { try_files /index.html =404; }
    location / { try_files $uri =404; }
  }
}
